    <script>
      const buttons = document.querySelectorAll(".journal-option");
      const viewer = document.getElementById("pdfViewer");
      const openPdf = document.getElementById("openPdf");
      const title = document.getElementById("pdfTitle");
      const meta = document.getElementById("pdfMeta");

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          buttons.forEach((item) => item.classList.toggle("active", item === button));
          viewer.src = button.dataset.pdf;
          openPdf.href = button.dataset.pdf;
          title.textContent = button.querySelector("span").textContent;
          meta.textContent = button.querySelector("small").textContent;
        });
      });
    </script>
